<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Support AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .chat-container { background: #1e293b; width: 100%; max-width: 520px; height: 85vh; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { color: #f8fafc; font-size: 1.1rem; }
    .status-badge { background: #10b981; color: #fff; font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; }
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.agent { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
    .tool-badge { display: inline-block; font-size: 0.7rem; color: #38bdf8; background: #0f172a; padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; font-weight: 600; }
    .input-bar { display: flex; padding: 12px; background: #0f172a; border-top: 1px solid #334155; gap: 8px; }
    input { flex: 1; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 10px 14px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #38bdf8; }
    button { background: #2563eb; color: #fff; border: none; padding: 0 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h2>🍽️ Restaurant Support AI</h2>
    <span class="status-badge">Online</span>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg agent">
      Namaste! Main aapka AI support agent hoon. Order tracking (e.g. <code>ORD-1001</code>), menu ya refund related queries ke liye pooch sakte hain.
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKey(event)" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const chatBox = document.getElementById("chatBox");
  const userInput = document.getElementById("userInput");

  function handleKey(e) {
    if (e.key === "Enter") sendMessage();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Append user message
    chatBox.innerHTML += `<div class="msg user">${text}</div>`;
    userInput.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Placeholder loading
    const loadingId = "loader-" + Date.now();
    chatBox.innerHTML += `<div class="msg agent" id="${loadingId}">Typing...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const res = await fetch("/api/agent/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      const loader = document.getElementById(loadingId);

      let content = "";
      if (data.tool_called) {
        content += `<span class="tool-badge">⚙️ Tool: ${data.tool_called}</span><br/>`;
      }
      content += (data.reply || "No response").replace(/\n/g, "<br/>");
      loader.innerHTML = content;
    } catch (err) {
      document.getElementById(loadingId).innerText = "Error: Could not reach agent service.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
